name: Bootstrap Tenttop source

on:
  push:
    paths:
      - '.bootstrap/source.part4'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand source bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/tenttop-source
          mkdir -p /tmp/tenttop-source
          cat .bootstrap/source.part1 .bootstrap/source.part2 .bootstrap/source.part3 .bootstrap/source.part4 | base64 --decode > /tmp/tenttop-source.tar.xz
          tar -xJf /tmp/tenttop-source.tar.xz -C /tmp/tenttop-source
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            ! -name .bootstrap \
            -exec rm -rf {} +
          cp -a /tmp/tenttop-source/. .
          rm -rf .bootstrap

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript check
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Commit verified source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "Bootstrap Tenttop production app [skip ci]"
          git push origin HEAD:main
